name: Notion Daily Digest

on:
  schedule:
    # Morning 9:00 local (LA, during PDT): 16:00 UTC
    - cron: "0 16 * * *"
    # Midday 14:00 local (LA, during PDT): 21:00 UTC
    - cron: "0 21 * * *"
    # Evening 22:00 local (LA, during PDT): 05:00 UTC
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "morning"
        type: choice
        options:
          - morning
          - midday
          - evening

jobs:
  digest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Morning digest
        if: (github.event_name == 'schedule' && github.event.schedule == '0 16 * * *') || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'morning')
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTIFIER: ${{ vars.NOTIFIER }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

          ENABLE_AI_SUMMARY: ${{ vars.ENABLE_AI_SUMMARY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          AI_SUMMARY_WINDOW_DAYS: ${{ vars.AI_SUMMARY_WINDOW_DAYS }}
          AI_SUMMARY_MAX_TASKS: ${{ vars.AI_SUMMARY_MAX_TASKS }}

          NOTION_TASK_PROP: ${{ vars.NOTION_TASK_PROP }}
          NOTION_PRIORITY_PROP: ${{ vars.NOTION_PRIORITY_PROP }}
          NOTION_STATUS_PROP: ${{ vars.NOTION_STATUS_PROP }}
          NOTION_DUE_PROP: ${{ vars.NOTION_DUE_PROP }}
          NOTION_DONE_CHECKBOX_PROP: ${{ vars.NOTION_DONE_CHECKBOX_PROP }}
          NOTION_PROJECT_PROP: ${{ vars.NOTION_PROJECT_PROP }}
          NOTION_ESTIMATED_MINUTES_PROP: ${{ vars.NOTION_ESTIMATED_MINUTES_PROP }}
          NOTION_CREATED_TIME_PROP: ${{ vars.NOTION_CREATED_TIME_PROP }}
          NOTION_LAST_EDITED_PROP: ${{ vars.NOTION_LAST_EDITED_PROP }}

          CLOSED_STATUS_VALUES: ${{ vars.CLOSED_STATUS_VALUES }}
          DUE_WINDOW_DAYS: ${{ vars.DUE_WINDOW_DAYS }}
          DUE_SOON_DAYS: ${{ vars.DUE_SOON_DAYS }}
          PLANNING_HORIZON_DAYS: ${{ vars.PLANNING_HORIZON_DAYS }}
          FUTURE_RISK_DAILY_MINUTES_THRESHOLD: ${{ vars.FUTURE_RISK_DAILY_MINUTES_THRESHOLD }}
          URGENT_LOAD_DAYS: ${{ vars.URGENT_LOAD_DAYS }}
          URGENT_LOAD_MIN_DAILY_MINUTES: ${{ vars.URGENT_LOAD_MIN_DAILY_MINUTES }}
          URGENT_LOAD_BOOST: ${{ vars.URGENT_LOAD_BOOST }}
          URGENT_LOAD_HEAVY_MINUTES: ${{ vars.URGENT_LOAD_HEAVY_MINUTES }}
          URGENT_LOAD_HEAVY_BOOST: ${{ vars.URGENT_LOAD_HEAVY_BOOST }}
          ONE_OFF_MINUTES: ${{ vars.ONE_OFF_MINUTES }}
          ONE_OFF_MAX_TASKS: ${{ vars.ONE_OFF_MAX_TASKS }}

          W_PRIORITY: ${{ vars.W_PRIORITY }}
          W_DUE: ${{ vars.W_DUE }}
          W_STALE: ${{ vars.W_STALE }}
          OVERDUE_BOOST: ${{ vars.OVERDUE_BOOST }}
          STALENESS_CAP_DAYS: ${{ vars.STALENESS_CAP_DAYS }}
          TOP3_MAX_PER_PROJECT: ${{ vars.TOP3_MAX_PER_PROJECT }}
          DEFAULT_ESTIMATED_MINUTES: ${{ vars.DEFAULT_ESTIMATED_MINUTES }}

          GOOGLE_CLIENT_EMAIL: ${{ secrets.GOOGLE_CLIENT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          GOOGLE_SOURCE_CALENDAR_ID: ${{ secrets.GOOGLE_SOURCE_CALENDAR_ID }}
          GOOGLE_PLANNER_CALENDAR_ID: ${{ secrets.GOOGLE_PLANNER_CALENDAR_ID }}
          WORKDAY_START_HOUR: ${{ vars.WORKDAY_START_HOUR }}
          WORKDAY_END_HOUR: ${{ vars.WORKDAY_END_HOUR }}
          LUNCH_START_HOUR: ${{ vars.LUNCH_START_HOUR }}
          LUNCH_START_MINUTE: ${{ vars.LUNCH_START_MINUTE }}
          LUNCH_END_HOUR: ${{ vars.LUNCH_END_HOUR }}
          LUNCH_END_MINUTE: ${{ vars.LUNCH_END_MINUTE }}
          FOCUS_BUFFER_MINUTES: ${{ vars.FOCUS_BUFFER_MINUTES }}
          PLAN_MIN_BLOCK_MINUTES: ${{ vars.PLAN_MIN_BLOCK_MINUTES }}
          PLAN_MAX_BLOCKS: ${{ vars.PLAN_MAX_BLOCKS }}
          PLAN_MAX_PROJECTS: ${{ vars.PLAN_MAX_PROJECTS }}
          PLAN_CANDIDATE_LIMIT: ${{ vars.PLAN_CANDIDATE_LIMIT }}
          PLANNER_EVENT_PREFIX: ${{ vars.PLANNER_EVENT_PREFIX }}
          PLANNER_EVENT_COLOR_ID: ${{ vars.PLANNER_EVENT_COLOR_ID }}

          MAX_SLACK_LINES: ${{ vars.MAX_SLACK_LINES }}
          MAX_TASKS_PER_SECTION: ${{ vars.MAX_TASKS_PER_SECTION }}
          TIMEZONE: America/Los_Angeles
          MORNING_HOUR_LOCAL: 9
          MIDDAY_HOUR_LOCAL: 14
          EVENING_HOUR_LOCAL: 18
          ENFORCE_LOCAL_HOUR: 0
          MODE: morning
        run: node src/index.js

      - name: Midday replan
        if: (github.event_name == 'schedule' && github.event.schedule == '0 21 * * *') || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'midday')
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
